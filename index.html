<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>IP 訂閱與查詢</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --console-bg: #020617;
      --console-text: #4ade80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.4);
    }

    .header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text);
    }

    /* 控制項佈局：手機預設垂直堆疊 */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 桌機與大螢幕平板自動轉為橫向排列 */
    @media (min-width: 640px) {
      body { padding: 24px; }
      .container { padding: 24px; }
      .control-group {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 12px;
      }
      .input-row {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr auto;
      }
    }

    select, input[type="text"], button {
      height: 46px; /* 增加觸控友善高度 */
      border-radius: 8px;
      font-size: 16px; /* 防止 iOS 點擊輸入框時畫面自動放大 */
      outline: none;
    }

    select, input[type="text"] {
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 14px;
      width: 100%;
      transition: border-color 0.15s ease;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"][readonly] {
      color: var(--text-muted);
      cursor: default;
    }

    button {
      padding: 0 20px;
      background-color: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover:not(:disabled) {
      background-color: var(--accent-hover);
      color: #fff;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background-color: var(--border);
      color: var(--text-muted);
    }

    .output-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    textarea {
      width: 100%;
      height: 320px;
      background-color: var(--console-bg);
      color: var(--console-text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
    }

    @media (min-width: 640px) {
      textarea { height: 380px; font-size: 14px; }
    }

    textarea:focus {
      border-color: var(--border);
      outline: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span>IP 訂閱與查詢</span>
    </div>

    <div class="control-group">
      <select id="regionSelect" onchange="handleSelectChange()">
        <option value="">-- 請選擇地區 --</option>
      </select>

      <div class="input-row">
        <input type="text" id="subUrlInput" placeholder="選擇地區後自動生成訂閱網址" readonly />
        <button id="subBtn" onclick="copySubUrl()" disabled>複製訂閱地址</button>
      </div>
    </div>

    <span class="output-label">IP 列表資訊</span>
    <textarea id="ipOutput" readonly placeholder="等待選擇地區..."></textarea>
  </div>

  <script>
    let regionData = {};

    // 載入並解析 iplist.txt
    fetch('iplist.txt')
      .then(res => res.text())
      .then(text => {
        parseIPList(text);
        populateSelect();
      });

    function parseIPList(text) {
      const lines = text.split('\n');
      let currentRegion = '';

      lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        // 判斷是否為地區標頭（不含數字與冒號）
        if (!line.includes('.') && !line.includes(':')) {
          currentRegion = line;
          if (!regionData[currentRegion]) {
            regionData[currentRegion] = [];
          }
        } else if (currentRegion) {
          regionData[currentRegion].push(line);
        }
      });
    }

    function populateSelect() {
      const select = document.getElementById('regionSelect');
      Object.keys(regionData).forEach(region => {
        const opt = document.createElement('option');
        opt.value = region;
        opt.textContent = region;
        select.appendChild(opt);
      });
    }

    async function handleSelectChange() {
      const select = document.getElementById('regionSelect');
      const val = select.value;
      const subBtn = document.getElementById('subBtn');
      const output = document.getElementById('ipOutput');
      const subUrlInput = document.getElementById('subUrlInput');

      if (val) {
        // 自動生成對應地區的完整訂閱 .txt 網址
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        const subUrl = baseUrl + encodeURIComponent(val) + '.txt';
        
        subUrlInput.value = subUrl;
        subBtn.disabled = false;

        // 直接抓取該地區獨立 .txt 檔案的內容顯示在文本框中
        try {
          output.value = '載入中...';
          const res = await fetch(subUrl);
          if (res.ok) {
            const text = await res.text();
            output.value = text.trim();
          } else {
            output.value = '讀取該地區檔案失敗';
          }
        } catch (err) {
          output.value = '請求發生錯誤';
        }
      } else {
        output.value = '';
        subUrlInput.value = '';
        subBtn.disabled = true;
      }
    }

    function copySubUrl() {
      const subUrlInput = document.getElementById('subUrlInput');
      if (!subUrlInput.value) return;

      navigator.clipboard.writeText(subUrlInput.value).then(() => {
        const subBtn = document.getElementById('subBtn');
        const originalText = subBtn.textContent;
        subBtn.textContent = '已複製！';
        setTimeout(() => {
          subBtn.textContent = originalText;
        }, 1500);
      }).catch(err => {
        subUrlInput.select();
        document.execCommand('copy');
        alert('已複製訂閱地址：\n' + subUrlInput.value);
      });
    }
  </script>
</body>
</html>
