<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>IP 訂閱與查詢</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #1a1a1a; color: #fff; }
    .row { margin-bottom: 15px; }
    input[type="text"] { width: 350px; padding: 5px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
    select { padding: 5px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
    button { padding: 6px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
    button:hover:not(:disabled) { background: #444; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    textarea { width: 100%; max-width: 500px; background: #111; color: #00ff00; border: 1px solid #444; border-radius: 4px; padding: 10px; }
  </style>
</head>
<body>

  <div class="row">
    <label for="regionSelect">選擇省份/城市：</label>
    <select id="regionSelect" onchange="handleSelectChange()">
      <option value="">-- 請選擇 --</option>
    </select>
  </div>

  <div class="row">
    <label for="subUrlInput">訂閱地址：</label>
    <input type="text" id="subUrlInput" readonly />
    <button id="subBtn" onclick="copySubUrl()" disabled>複製訂閱地址</button>
  </div>

  <h3>IP 列表：</h3>
  <textarea id="ipOutput" rows="15" readonly></textarea>

  <script>
    let regionData = {};

    // 載入並解析 iplist.txt
    fetch('iplist.txt')
      .then(res => res.text())
      .then(text => {
        parseIPList(text);
        populateSelect();
      });

    function parseIPList(text) {
      const lines = text.split('\n');
      let currentRegion = '';

      lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        // 判斷是否為地區標頭（不含數字與冒號）
        if (!line.includes('.') && !line.includes(':')) {
          currentRegion = line;
          if (!regionData[currentRegion]) {
            regionData[currentRegion] = [];
          }
        } else if (currentRegion) {
          regionData[currentRegion].push(line);
        }
      });
    }

    function populateSelect() {
      const select = document.getElementById('regionSelect');
      Object.keys(regionData).forEach(region => {
        const opt = document.createElement('option');
        opt.value = region;
        opt.textContent = region;
        select.appendChild(opt);
      });
    }

    async function handleSelectChange() {
      const select = document.getElementById('regionSelect');
      const val = select.value;
      const subBtn = document.getElementById('subBtn');
      const output = document.getElementById('ipOutput');
      const subUrlInput = document.getElementById('subUrlInput');

      if (val) {
        // 自動生成對應地區的完整訂閱 .txt 網址
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        const subUrl = baseUrl + encodeURIComponent(val) + '.txt';
        
        subUrlInput.value = subUrl;
        subBtn.disabled = false;

        // 直接抓取該地區獨立 .txt 檔案的內容顯示在文本框中
        try {
          output.value = '載入中...';
          const res = await fetch(subUrl);
          if (res.ok) {
            const text = await res.text();
            output.value = text.trim();
          } else {
            output.value = '讀取該地區檔案失敗';
          }
        } catch (err) {
          output.value = '請求發生錯誤';
        }
      } else {
        output.value = '';
        subUrlInput.value = '';
        subBtn.disabled = true;
      }
    }

    function copySubUrl() {
      const subUrlInput = document.getElementById('subUrlInput');
      if (!subUrlInput.value) return;

      navigator.clipboard.writeText(subUrlInput.value).then(() => {
        const subBtn = document.getElementById('subBtn');
        const originalText = subBtn.textContent;
        subBtn.textContent = '已複製！';
        setTimeout(() => {
          subBtn.textContent = originalText;
        }, 1500);
      }).catch(err => {
        subUrlInput.select();
        document.execCommand('copy');
        alert('已複製訂閱地址：\n' + subUrlInput.value);
      });
    }
  </script>
</body>
</html>
